name: Deploy Kunming AI camp
on:
  push:
    branches: [deploy/kiz-ai-camp-2026]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kiz-ai-camp-2026-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package production runtime
        run: |
          set -euo pipefail
          mkdir -p release/backend
          cp -R dist config.json package.json ops release/
          cp backend/*.js backend/*.json release/backend/
          cp "$(command -v node)" release/node
          printf '%s\n' "$GITHUB_SHA" > release/REVISION
          printf '{"revision":"%s","site":"kiz-ai-camp-2026","mode":"production"}\n' "$GITHUB_SHA" > release/dist/deployment.json
          tar -C release -czf camp-release.tar.gz .
          sha256sum camp-release.tar.gz > camp-release.tar.gz.sha256
      - name: Connect to the shared production host
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = 8.147.58.40
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/camp_key
          chmod 600 ~/.ssh/camp_key
          cp ops/known_hosts ~/.ssh/known_hosts
          camp_target="$DEPLOY_USER@$DEPLOY_HOST"
          camp_remote="/tmp/kiz-ai-camp-2026-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          camp_ssh=(-i ~/.ssh/camp_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${camp_ssh[@]}" "$camp_target" "umask 077; mkdir -p '$camp_remote'"
          scp "${camp_ssh[@]}" camp-release.tar.gz camp-release.tar.gz.sha256 ops/camp-deploy.py ops/camp-diagnose.mjs "$camp_target:$camp_remote/"
          ssh "${camp_ssh[@]}" "$camp_target" "/opt/events/kiz-ai-camp-2026/production/current/node --env-file=/opt/events/kiz-ai-camp-2026/production/shared/app.env '$camp_remote/camp-diagnose.mjs'"
          ssh "${camp_ssh[@]}" "$camp_target" "python3 '$camp_remote/camp-deploy.py' '$camp_remote' '$GITHUB_SHA'"
      - name: Verify published revision and account routing
        run: |
          node --input-type=module - <<'JS'
          const origin='https://kiz-ai-camp-2026.tashan.ac.cn';
          const r=await fetch(origin+'/deployment.json?revision='+process.env.GITHUB_SHA,{cache:'no-store',signal:AbortSignal.timeout(20000)});
          const data=await r.json();
          if(data.revision!==process.env.GITHUB_SHA)throw Error('Published revision mismatch');
          for(const [path,status]of [['/',200],['/healthz',200],['/api/v1/me/profile',401],['/api/forum/me',401]]){
            const response=await fetch(origin+path,{redirect:'error',signal:AbortSignal.timeout(20000)});
            if(response.status!==status)throw Error('Unexpected production response: '+path+' '+response.status);
          }
          const sso=await (await fetch(origin+'/api/forum/sso/status',{signal:AbortSignal.timeout(20000)})).json();
          if(sso.enabled!==true)throw Error('SSO login entry was not enabled');
          const content=await (await fetch(origin+'/api/site/content',{signal:AbortSignal.timeout(20000)})).json();
          if(!content.revision||!content.pages?.length||!content.fields?.length||content.preview)throw Error('Published CMS content unavailable');
          console.log('Published and verified: '+origin);
          JS
