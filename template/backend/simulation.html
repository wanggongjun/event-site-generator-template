<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地飞书审核模拟器</title><style>
body{font:16px system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 20px;background:#f7f9fc;color:#142340}h1{font-size:28px}.warning{border:2px solid #d97706;padding:18px;background:#fff4dc;border-radius:12px}section{background:white;padding:22px;margin:20px 0;border-radius:12px;border:1px solid #d7dfeb}label{display:block;margin:12px 0 4px}select,input,textarea,button{font:inherit;padding:9px;max-width:100%;box-sizing:border-box}input,select,textarea{width:100%;border:1px solid #adbbd0;border-radius:6px}button{background:#214ca7;color:white;border:0;border-radius:6px;cursor:pointer;margin:10px 8px 0 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:10px;text-align:left;border-bottom:1px solid #e0e5ee;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere}.success{color:#087948}.error{color:#b42318}.scroll{overflow:auto}
</style><script defer src="/simulation.js"></script></head><body>
<h1>本地飞书审核模拟器</h1>
<div class="warning"><strong>仅模拟 · 没有连接短信或飞书</strong><p>此页面只在模拟模式和本机访问时可用，不是管理员平台。正式活动请在飞书多维表格审核。验证码显示在注册/重置页面。</p></div>
<section><h2>模拟工作人员审核</h2><p>审核命令会进入与飞书相同的同步流程，默认约60秒后生效。可先要求补材料，再用参会者账户补充并重新送审。也可更正已作出的结果，参会资格将重新计算。</p>
<form id="review"><label for="phone">注册手机号</label><input id="phone" name="phone" required placeholder="13800000000"><label for="kind">申请类型</label><select id="kind" name="kind"><option value="submission">线上投稿</option><option value="attendance">独立参会报名</option></select><label for="decision">审核结果</label><select id="decision" name="decision"><option value="needs_materials">需要补充材料</option><option value="accepted">通过 / 录用</option><option value="rejected">不通过</option></select><label for="feedback">反馈</label><textarea id="feedback" name="feedback" rows="3" placeholder="例如：请补充完整论文PDF"></textarea><button type="submit">排队模拟审核</button></form>
<button id="sync">立即同步（测试专用，跳过延迟）</button><button id="refresh">刷新状态</button><p id="message" role="status" aria-live="polite"></p></section>
<section><h2>共享参会名单</h2><p id="stats"></p><div class="scroll"><table><thead><tr><th>姓名 / 手机</th><th>独立参会审核</th><th>投稿审核</th><th>最终参会资格</th></tr></thead><tbody id="users"></tbody></table></div></section>
<section><h2>最近模拟审核命令</h2><pre id="queue"></pre></section>
</body></html>
